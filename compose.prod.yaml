services:
  frontend:
    build:
      context: ./frontend
    ports: []
    volumes: []
    command: []
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    environment:
      SECRET_KEY: ${SECRET_KEY:?error}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-vlms-verify-token}
      CORS_ORIGINS: ${CORS_ORIGINS:?error}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    environment:
      SECRET_KEY: ${SECRET_KEY:?error}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-vlms-verify-token}
      CORS_ORIGINS: ${CORS_ORIGINS:?error}

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend

  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    entrypoint: ["sh", "-c"]
    command:
      - exec ngrok http caddy:80 ${NGROK_DOMAIN:+--url $NGROK_DOMAIN}
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?error}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      - caddy

volumes:
  caddy_data:
