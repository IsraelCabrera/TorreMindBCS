services:
  frontend:
    build:
      context: ./frontend
    ports: []
    volumes: []
    depends_on:
      - backend

  backend:
    environment:
      SECRET_KEY: ${SECRET_KEY:?error}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-vlms-verify-token}
      CORS_ORIGINS: ${CORS_ORIGINS:?error}

  worker:
    environment:
      SECRET_KEY: ${SECRET_KEY:?error}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-vlms-verify-token}
      CORS_ORIGINS: ${CORS_ORIGINS:?error}

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend

  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    command:
      - sh
      - -c
      - exec ngrok http caddy:80 ${NGROK_DOMAIN:+--domain $NGROK_DOMAIN}
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?error}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      - caddy

volumes:
  caddy_data:
